name: Release Plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空则自动生成日期版本，格式：Y.M.D）'
        required: false
        default: ''
  schedule:
    - cron: '17 0 * * *'

concurrency:
  group: release-plugin
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for new commits since last release
        id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "手动触发，跳过门禁直接发版"
            echo "should_release=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          LAST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -z "$LAST_TAG" ]; then
            echo "仓库尚无 tag，视为首次发版"
            echo "should_release=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          COUNT="$(git log --oneline --invert-grep \
                     --grep='^chore(release): bump to v' \
                     "${LAST_TAG}..HEAD" | wc -l)"
          echo "自 ${LAST_TAG} 以来的提交："
          git log --oneline "${LAST_TAG}..HEAD"
          echo "其中非发版提交数：${COUNT}"

          if [ "$COUNT" -gt 0 ]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "✅ 有 ${COUNT} 个新提交，继续发版" >> $GITHUB_STEP_SUMMARY
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "⏭️ 自 ${LAST_TAG} 以来无新提交，跳过今日发版" >> $GITHUB_STEP_SUMMARY
          fi

  release:
    needs: gate
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="$(TZ='Asia/Shanghai' date +'%Y.%-m.%-d')"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Generated version: ${VERSION}"

      - name: Update version in plugin.json / package.json
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          node -e "
            const fs = require('fs');
            for (const f of ['plugin.json', 'package.json']) {
              const p = JSON.parse(fs.readFileSync(f, 'utf-8'));
              p.version = '${VERSION}';
              fs.writeFileSync(f, JSON.stringify(p, null, 2) + '\n');
            }
          "

      - name: Build
        run: pnpm run build

      - name: Extract plugin info
        id: plugin_info
        run: |
          ENTRY_PATH=$(node -p "require('./plugin.json').entryPath")
          ZIP_NAME="${ENTRY_PATH}.jsplugin.zip"
          echo "entryPath=${ENTRY_PATH}" >> $GITHUB_OUTPUT
          echo "zip_name=${ZIP_NAME}" >> $GITHUB_OUTPUT

      - name: Commit version bump and push
        id: bump
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP_NAME="${{ steps.plugin_info.outputs.zip_name }}"
          TAG="v${VERSION}"
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ZIP_NAME}"
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('plugin.json', 'utf-8'));
            p.version = '${VERSION}';
            p.download_url = '${DOWNLOAD_URL}';
            fs.writeFileSync('plugin.json', JSON.stringify(p, null, 2) + '\n');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf-8'));
            pkg.version = '${VERSION}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugin.json package.json
          if git diff --staged --quiet; then
            echo "版本号与 download_url 均无变化，跳过 bump 提交"
          else
            git commit -m "chore(release): bump to v${VERSION}"
            pushed=0
            for attempt in 1 2 3; do
              if git push; then pushed=1; break; fi
              echo "push 被拒（第 ${attempt} 次），rebase 到远端后重试"
              git fetch origin "${GITHUB_REF_NAME}"
              if ! git rebase "origin/${GITHUB_REF_NAME}"; then
                git rebase --abort || true
                echo "::error::rebase 冲突，请检查后手动重跑"
                exit 1
              fi
              sleep $((attempt * 5))
            done
            if [ "$pushed" != 1 ]; then
              echo "::error::3 次重试后仍无法推送 bump 提交"
              exit 1
            fi
          fi
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP_NAME="${{ steps.plugin_info.outputs.zip_name }}"
          TAG="${{ steps.bump.outputs.tag }}"

          if gh release view "${TAG}" &>/dev/null; then
            gh release delete "${TAG}" --yes --cleanup-tag
          fi

          gh release create "${TAG}" \
            "dist/${ZIP_NAME}" \
            --target "${{ steps.bump.outputs.sha }}" \
            --title "v${VERSION}" \
            --notes "自动构建的 JS 插件 v${VERSION}"
